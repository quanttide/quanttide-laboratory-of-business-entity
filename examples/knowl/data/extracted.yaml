ambiguities:
- category: 章程层面
  description: 第十八条"金额标准"与"让利比例"由管理层另行制定——具体数值未定义，编码时视为配置参数
- category: 章程层面
  description: 第十四条"其他类型客户"一事一议——无定价规则
- category: 章程层面
  description: 资深/中级/初级人员定价待补充
- category: 手册层面
  description: 人员等级表中"资深""中级""初级"的对应人选和服务对象均为"待补充"
- category: 手册层面
  description: 谈判话术模板中让利规则引用报价档案，但未说明保本线的计算方式
- category: 教程层面
  description: 无明确金额数字，只有定价思维框架
- category: 教程层面
  description: '"成本大约 X 元"中的 X 未给出，标注"按各业务线核算"'
issues:
- number: 1
  title: '"保本线"未定义'
  source: profile 让利规则
  problem: 首次合作不低于保本线，但保本线的计算方式和具体数值未定义
  suggestion: 补充保本线的计算公式或默认值（如 = 成本 × 1.2）
- number: 2
  title: 资深/中级/初级人员定价缺失
  source: profile 人员分级
  problem: 五个等级中只有首席和高级有具体价格，其余标注为"待补充"
  suggestion: 补充缺失的人员定价，或明确其不可用状态
- number: 3
  title: 金额标准与让利比例未定义
  source: bylaw 第十八条
  problem: 章程规定"金额标准"和"让利比例"由管理层另行制定，但当前无具体数值
  suggestion: 制定并补充这两个配置参数
- number: 4
  title: 高校客户定价依赖个案
  source: profile 客户类型
  problem: 高校客户为"按合作协议"，无法编码为确定的定价规则
  suggestion: 如有常见合作模式，定义标准价格区间
- number: 5
  title: 稀缺性/创新溢价/长期价值评估无量化标准
  source: bylaw 第十一至十三条
  problem: 三个评估要素均为定性判断，无法直接编码
  suggestion: 如需要这些评估自动化，可设计评分量表（如 1-5 分）将定性转为定量
observations:
- 教程的四层定价思维模型是好框架，但具体定价完全依赖报价档案
- 手册的 10 条"不得"规则非常适合编码为断言/校验
- 报价单 3:4:3 结构比例清晰，可直接编码为默认模板
conclusions:
- 可编码率 53%**：约一半规则已清晰到可直接翻译为代码，另一半有明确改进方向。
- 文档质量度量**：可编码性评分提供了一个客观的文档质量度量——章程/手册/档案的质量 = 可编码性得分。5 分说明文档清晰，1-2 分说明有改进空间。
- 治理即代码**：Assets → Data → Code → Docs 管线可行。结构化时发现保本线未定义，编码时发现人员定价缺失，评估时发现稀缺性无量化标准——这些问题在纯文本阅读时容易被忽略，但在编码时变得不可回避。
